[project]
name = "instagram-crew"
version = "0.1.0"
requires-python = ">=3.10,<3.13"

dependencies = [
    "crewai[anthropic,tools]>=0.80.0",
    "crewai-tools>=0.14.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_crew"]

[tool.crewai]
type = "crew"
